name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # so `git describe` can stamp a version
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      # Formatting, vet, tests and the race detector.
      - run: make check
      # Every platform a release is built for must compile.
      - run: make cross
      # The blob paths, against the storage emulator.
      - run: make e2e
