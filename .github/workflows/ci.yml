name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Formatting, vet and the race detector once, where they are cheapest.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          check-latest: true
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::not gofmt'd:"; echo "$unformatted"; exit 1
          fi
      - run: go vet ./...
      - name: go mod tidy is a no-op
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum
      - name: Race detector
        run: go test -race ./...

  # The tests themselves, natively, on the platforms whose runners are cheap.
  # The copy semantics are full of things that differ per operating system —
  # symbolic links, file modes, device identity, path separators — so they are
  # worth running for real rather than only cross-compiling. macOS is left out
  # on cost: its runners are billed at a multiple of these, and its copy path
  # shares plat_unix.go with Linux, so only clonefile and the timestamp field
  # names go untested here. The cross job still compiles it, and the release
  # workflow still builds it on a macOS runner for the keychain.
  test:
    name: test ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest      # linux/amd64
          - ubuntu-24.04-arm   # linux/arm64
          - windows-latest     # windows/amd64
          - windows-11-arm     # windows/arm64
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          check-latest: true
      - run: go build ./...
      - run: go test ./...

  # Every platform a release is built for must at least compile from here, so a
  # broken build tag is caught without waiting for a tag.
  cross:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          check-latest: true
      - run: make cross

  # The blob paths, against the Azure storage emulator. Docker is only
  # available on the Linux runners.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          check-latest: true
      - run: make e2e
