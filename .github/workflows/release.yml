name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (must already exist)'
        required: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  # Set once so the archive names and the stamped version cannot disagree.
  VERSION: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  # A tag push does not run ci.yml, so a release checks itself rather than
  # trusting that main was green when the tag was cut.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          check-latest: true
      - run: go vet ./...
      - run: go test ./...
      - run: make cross

  build:
    needs: verify
    name: ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux and Windows are built without cgo, so the binaries are static
          # and carry no libc requirement.
          - { os: ubuntu-latest,    goos: linux,   goarch: amd64, cgo: '0' }
          - { os: ubuntu-24.04-arm, goos: linux,   goarch: arm64, cgo: '0' }
          - { os: windows-latest,   goos: windows, goarch: amd64, cgo: '0' }
          - { os: windows-11-arm,   goos: windows, goarch: arm64, cgo: '0' }
          # macOS reaches its keychain through cgo, and a binary cross-compiled
          # without it cannot remember a sign-in. Each is built on its own
          # runner so that it can.
          - { os: macos-15-intel,   goos: darwin,  goarch: amd64, cgo: '1' }
          - { os: macos-latest,     goos: darwin,  goarch: arm64, cgo: '1' }
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          check-latest: true

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: ${{ matrix.cgo }}
        run: |
          set -euo pipefail
          out=azcp
          if [ "$GOOS" = windows ]; then out=azcp.exe; fi
          go build -trimpath \
            -ldflags "-s -w -X 'github.com/JohanLindvall/azcp/internal/cli.Version=${VERSION}'" \
            -o "build/$out" ./cmd/azcp
          ls -l build

      # Every entry above builds natively, so the binary can be run here to
      # confirm the version was actually stamped into it.
      - name: Check the binary reports the right version
        run: |
          set -euo pipefail
          out=azcp
          if [ "${{ matrix.goos }}" = windows ]; then out=azcp.exe; fi
          reported=$("./build/$out" --version | head -1)
          echo "$reported"
          case "$reported" in
            *"${VERSION}"*) ;;
            *) echo "::error::version was not stamped: $reported"; exit 1 ;;
          esac

      - name: Stage the archive contents
        run: |
          set -euo pipefail
          name="azcp_${VERSION}_${{ matrix.goos }}_${{ matrix.goarch }}"
          echo "PKG=$name" >> "$GITHUB_ENV"
          mkdir -p "dist/$name"
          cp README.md LICENSE "dist/$name/"
          cp build/* "dist/$name/"

      - name: Archive (zip)
        if: matrix.goos == 'windows'
        shell: pwsh
        run: Compress-Archive -Path "dist/$env:PKG" -DestinationPath "dist/$env:PKG.zip"

      - name: Archive (tar.gz)
        if: matrix.goos != 'windows'
        run: tar -C dist -czf "dist/${PKG}.tar.gz" "${PKG}"

      # The archives above carry the documentation with them, which is what a
      # person downloading by hand wants. A script wants the binary and nothing
      # else, so it is also published on its own: one file, compressed, that
      # decompresses straight to an executable.
      - name: Compressed binary on its own (gzip)
        if: matrix.goos != 'windows'
        run: |
          set -euo pipefail
          gzip -9 -c build/azcp > "dist/${PKG}.bin.gz"
          ls -l "dist/${PKG}.bin.gz"

      - name: Compressed binary on its own (zip)
        if: matrix.goos == 'windows'
        shell: pwsh
        run: Compress-Archive -Path build/azcp.exe -DestinationPath "dist/$env:PKG.exe.zip"

      - name: Remove the staging directory
        run: rm -rf "dist/${PKG}"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ env.PKG }}
          path: |
            dist/${{ env.PKG }}.tar.gz
            dist/${{ env.PKG }}.zip
            dist/${{ env.PKG }}.bin.gz
            dist/${{ env.PKG }}.exe.zip
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        run: |
          set -euo pipefail
          cd dist
          # Everything that is actually published, in one file.
          sha256sum azcp_* > SHA256SUMS
          cat SHA256SUMS

      - name: Release notes
        run: |
          set -euo pipefail
          cat > NOTES.md <<'EOF'
          A drop-in `cp` that also copies to and from Azure Blob Storage.

          ### Install

          Download the archive for your platform below, or:

          ```
          go install github.com/JohanLindvall/azcp/cmd/azcp@VERSION_PLACEHOLDER
          ```

          Or as a container:

          ```
          docker run --rm -v "$PWD:/data" ghcr.io/johanlindvall/azcp:IMAGE_PLACEHOLDER --help
          ```

          ### Binaries

          Each platform has two downloads: an archive with the README and the
          licence, and the binary on its own, compressed, for scripts.

          | platform | archive | binary only |
          | --- | --- | --- |
          | Linux x86-64 | `azcp_VERSION_PLACEHOLDER_linux_amd64.tar.gz` | `azcp_VERSION_PLACEHOLDER_linux_amd64.bin.gz` |
          | Linux arm64 | `azcp_VERSION_PLACEHOLDER_linux_arm64.tar.gz` | `azcp_VERSION_PLACEHOLDER_linux_arm64.bin.gz` |
          | macOS Apple silicon | `azcp_VERSION_PLACEHOLDER_darwin_arm64.tar.gz` | `azcp_VERSION_PLACEHOLDER_darwin_arm64.bin.gz` |
          | macOS Intel | `azcp_VERSION_PLACEHOLDER_darwin_amd64.tar.gz` | `azcp_VERSION_PLACEHOLDER_darwin_amd64.bin.gz` |
          | Windows x86-64 | `azcp_VERSION_PLACEHOLDER_windows_amd64.zip` | `azcp_VERSION_PLACEHOLDER_windows_amd64.exe.zip` |
          | Windows arm64 | `azcp_VERSION_PLACEHOLDER_windows_arm64.zip` | `azcp_VERSION_PLACEHOLDER_windows_arm64.exe.zip` |

          One line, no archive to unpack:

          ```
          curl -fsSL https://github.com/JohanLindvall/azcp/releases/download/VERSION_PLACEHOLDER/azcp_VERSION_PLACEHOLDER_linux_amd64.bin.gz \
            | gunzip > azcp && chmod +x azcp
          ```

          Verify with `sha256sum -c SHA256SUMS`.

          Linux and Windows binaries are static and need no runtime. macOS
          binaries are built on macOS so they can use the keychain to remember
          a sign-in between runs.
          EOF
          # Two conventions, not one. A Go module version is not a version
          # without its leading "v", while the image tags come from
          # docker/metadata-action's semver rule, which drops it — so naming
          # the image after the git tag names something that was never pushed.
          sed -i "s/VERSION_PLACEHOLDER/${VERSION}/g; s/IMAGE_PLACEHOLDER/${VERSION#v}/g" NOTES.md

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          files=(dist/azcp_* dist/SHA256SUMS)
          if gh release view "${VERSION}" >/dev/null 2>&1; then
            echo "release exists; refreshing its assets"
            gh release upload "${VERSION}" "${files[@]}" --clobber
          else
            gh release create "${VERSION}" \
              --title "azcp ${VERSION}" \
              --notes-file NOTES.md \
              --verify-tag \
              "${files[@]}"
          fi
