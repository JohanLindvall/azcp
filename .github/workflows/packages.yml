name: packages

on:
  workflow_call:
    inputs:
      ref:
        required: true
        type: string
      version:
        required: true
        type: string
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref to build (blank builds this workflow''s ref)'
        required: false
      version:
        description: 'Version to label the image with (blank derives it from the ref)'
        required: false

permissions:
  contents: read

concurrency:
  group: packages-publish
  cancel-in-progress: false
  queue: max

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/azcp

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # For the build provenance attestation.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
        with:
          # What to build and what to call it are separate, because they are
          # not always the same thing: a tag cut before this workflow existed
          # has no Dockerfile in it, and can only be imaged by building a tree
          # that has one.
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Work out the version
        id: version
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ -n "$REQUESTED_VERSION" ]; then
            version="$REQUESTED_VERSION"
          elif [ "${GITHUB_REF_TYPE}" = tag ]; then
            version="${GITHUB_REF_NAME}"
          else
            version="$(git describe --tags --always)"
          fi
          if [[ ! "$version" =~ ^[A-Za-z0-9][A-Za-z0-9._+-]*$ ]]; then
            echo "invalid image version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "building $version"
          latest=false
          if [ -n "$REQUESTED_VERSION" ]; then
            published=$(gh release list --limit 100 --json tagName,isLatest --jq '.[] | select(.isLatest) | .tagName')
            if [ "$version" = "$published" ]; then latest=true; fi
          fi
          echo "latest=$latest" >> "$GITHUB_OUTPUT"

      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ${{ env.IMAGE }}
          # Semver tags otherwise add latest implicitly, even for an older
          # release. The explicit raw tag below is the only source of latest.
          flavor: latest=false
          # Released images get an exact version. Only the latest release
          # advances moving tags; a late older build must not roll them back.
          # The separate main push still publishes edge while CI runs.
          tags: |
            type=semver,pattern={{version}},value=${{ steps.version.outputs.version }},enable=${{ inputs.version != '' }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.version.outputs.version }},enable=${{ steps.version.outputs.latest == 'true' }}
            type=raw,value=latest,enable=${{ steps.version.outputs.latest == 'true' }}
            type=edge,branch=main,enable=${{ inputs.version == '' }}
          labels: |
            org.opencontainers.image.title=azcp
            org.opencontainers.image.description=A drop-in cp that also copies to and from Azure Blob Storage
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.version=${{ steps.version.outputs.version }}

      - name: Build and push
        id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
          # Layers are gzip-compressed, which every runtime can pull. The image
          # is a static binary on scratch, so there is very little to compress.
          outputs: type=registry,compression=gzip,force-compression=true
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Attest what was built
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Report
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
          IMAGE_DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail
          echo "### Published" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "$IMAGE_TAGS" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "digest: $IMAGE_DIGEST" >> "$GITHUB_STEP_SUMMARY"
